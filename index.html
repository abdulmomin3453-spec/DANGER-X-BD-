<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DANGER X BD 🔥</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#070707;--card:#141011;--line:#2a1517;--red:#ff1e2d;--red2:#a30010;--tx:#f5eeee;--mut:#a08e90;--ok:#2ecc71;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
html,body{background:var(--bg);color:var(--tx);font:15px/1.45 Inter,system-ui,sans-serif}
body{max-width:520px;margin:auto;min-height:100vh;padding-bottom:78px}
h1,h2,h3,.hd{font-family:Rajdhani,Impact,sans-serif;letter-spacing:.5px}
h2{font-size:24px;margin:6px 0 12px}h3{font-size:19px}
main{padding:14px}
.top{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.logo{font:700 22px Rajdhani;color:var(--red);text-shadow:0 0 14px #ff1e2d88}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card.t{cursor:pointer;border-left:3px solid var(--red)}
.btn{background:linear-gradient(135deg,var(--red),var(--red2));color:#fff;border:0;border-radius:10px;padding:11px 16px;font:700 15px Rajdhani;letter-spacing:.8px;cursor:pointer;box-shadow:0 0 16px #ff1e2d44}
.btn.g{background:transparent;border:1px solid var(--red);box-shadow:none;color:var(--red)}
.btn.s{padding:6px 10px;font-size:13px}.btn.w{width:100%}
input,select,textarea{width:100%;background:#0d0a0b;border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:11px;margin:4px 0 10px;font:inherit}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--red);outline-offset:1px}
label{font-size:13px;color:var(--mut)}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px}
.chip{white-space:nowrap;border:1px solid var(--line);border-radius:20px;padding:6px 13px;color:var(--mut);background:none;font:inherit;cursor:pointer}
.chip.on{background:var(--red);color:#fff;border-color:var(--red)}
.tag{font:600 12px Rajdhani;padding:2px 9px;border-radius:6px;background:#2a1517;color:#ff6b75}
.tag.live{background:var(--red);color:#fff;animation:p 1.4s infinite}.tag.done{background:#14301f;color:var(--ok)}
@keyframes p{50%{opacity:.5}}
.mut{color:var(--mut);font-size:13px}
.hero{background:radial-gradient(circle at 80% 0,#ff1e2d55,transparent 60%),linear-gradient(160deg,#1c0509,#070707);border:1px solid var(--red2);border-radius:16px;padding:20px;margin-bottom:14px}
.hero h1{font-size:34px;line-height:1.05}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;display:flex;background:#0c0809;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:9}
.nav button{flex:1;background:none;border:0;color:var(--mut);padding:10px 0 8px;font:600 12px Rajdhani;cursor:pointer}
.nav button.on{color:var(--red)}.nav i{display:block;font-style:normal;font-size:20px}
.splash{position:fixed;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:99;gap:14px}
.splash .logo{font-size:44px}.bar{width:180px;height:4px;background:#222;border-radius:4px;overflow:hidden}
.bar b{display:block;height:100%;width:0;background:var(--red);animation:l 1.6s forwards}@keyframes l{to{width:100%}}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--red);color:#fff;padding:10px 18px;border-radius:10px;z-index:100;max-width:90%}
table{width:100%;border-collapse:collapse}td,th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}th{color:var(--mut);font-weight:500}
.room{background:#0d0a0b;border:1px dashed var(--red);border-radius:10px;padding:10px;font:700 18px Rajdhani}
.scroll{overflow-x:auto}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>
<div id="app"></div>
<script>
const K='dxbd_v1';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let mem=null;
function load(){try{const r=localStorage.getItem(K);if(r)return JSON.parse(r)}catch(e){}return null}
function save(){try{localStorage.setItem(K,JSON.stringify(db))}catch(e){}}
const hash=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))|0;return String(h)};
const now=Date.now(),H=36e5;
let db=load()||{
 users:[],
 tours:[
  {id:'t1',title:'Daily Squad Showdown',type:'Squad',cat:'Daily',map:'Bermuda',mode:'Battle Royale',start:now+5*H,deadline:now+4*H,cap:48,status:'upcoming',desc:'Daily squad clash. Top squads take the lobby.',rules:'No emulators. No teaming with other squads. Admin decisions are final.',room:null,results:null,featured:true},
  {id:'t2',title:'Solo Free Entry Cup',type:'Solo',cat:'Free Entry',map:'Purgatory',mode:'Battle Royale',start:now+26*H,deadline:now+24*H,cap:50,status:'upcoming',desc:'Free solo cup for everyone.',rules:'One account per player. No hacks.',room:null,results:null},
  {id:'t3',title:'Weekly Duo Rush',type:'Duo',cat:'Weekly',map:'Kalahari',mode:'Battle Royale',start:now-2*H,deadline:now-3*H,cap:24,status:'live',desc:'Weekly duo battle.',rules:'Both teammates must register.',room:null,results:null}],
 regs:[],notifs:[],reports:[],log:[],session:null,lang:'English',set:{push:true,priv:true}};
db.users=db.users.filter(u=>!(u.role==='admin'&&u.pw===hash('Admin@123')));save();
let S={tab:'home',view:'home',arg:null,filter:'All',q:'',atab:'tours',auth:'login'};
const me=()=>db.users.find(u=>u.id===db.session);
const isAdmin=()=>me()?.role==='admin';
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),2200)}
function notify(title,body,to='all'){db.notifs.unshift({id:'n'+Date.now()+Math.random(),title,body,to,at:Date.now()});save()}
function logA(a){db.log.unshift({a,by:me()?.email,at:Date.now()});save()}
const fmt=t=>new Date(t).toLocaleString([], {dateStyle:'medium',timeStyle:'short'});
function go(view,arg,tab){S.view=view;S.arg=arg??null;if(tab)S.tab=tab;render();scrollTo(0,0)}
function cd(t){const d=t-Date.now();if(d<=0)return 'Started';const h=Math.floor(d/H),m=Math.floor(d%H/6e4);return h>=24?Math.floor(h/24)+'d '+h%24+'h':h+'h '+m+'m'}
const regsOf=t=>db.regs.filter(r=>r.tid===t&&r.status!=='cancelled');
const myReg=t=>db.regs.find(r=>r.tid===t&&r.uid===db.session&&r.status!=='cancelled');
const tourCard=t=>`<div class="card t" onclick="go('tour','${t.id}')"><div class="row"><h3>${esc(t.title)}</h3><span class="tag ${t.status}">${t.status.toUpperCase()}</span></div><div class="mut">${t.type} · ${t.cat} · ${esc(t.map)}</div><div class="row" style="margin-top:8px"><span class="mut">${fmt(t.start)}</span><span class="mut">${regsOf(t.id).length}/${t.cap} players</span></div></div>`;
const empty=(i,m)=>`<div class="empty"><div style="font-size:38px">${i}</div>${m}</div>`;

/* ---------- screens ---------- */
function setupView(){return `<main><div class="hero"><div class="logo">DANGER X BD 🔥</div><h1 class="hd" style="margin-top:8px">Create owner admin</h1><div class="mut">Only this account will have admin access.</div></div><label>Admin email</label><input id="e" type="email"><label>Password (8+ characters)</label><input id="p" type="password"><label>Confirm password</label><input id="p2" type="password"><button class="btn w" onclick="setupAdmin()">Create admin account</button></main>`}
function setupAdmin(){const e=$('#e').value.trim().toLowerCase(),p=$('#p').value;if(!/^\S+@\S+\.\S+$/.test(e))return toast('Enter a valid email address.');if(p.length<8)return toast('Password needs at least 8 characters.');if(p!==$('#p2').value)return toast('Passwords do not match.');if(db.users.some(u=>u.role==='admin'))return toast('An admin already exists.');db.users=db.users.filter(u=>u.email!==e);db.users.push({id:'admin',name:'Owner',email:e,pw:hash(p),uid:'',ign:'DangerX',role:'admin',banned:false,created:Date.now()});db.session='admin';save();S.view='admin';S.tab='profile';render()}
function authView(){
 if(!db.users.some(u=>u.role==='admin'))return setupView();
 if(S.auth==='signup')return `<main><div class="hero"><h1 class="hd">Join DANGER X BD 🔥</h1></div>
 <label>Player name</label><input id="n"><label>Email</label><input id="e" type="email"><label>Free Fire UID (8–12 digits)</label><input id="u" inputmode="numeric"><label>In-game name</label><input id="i"><label>Password (6+ characters)</label><input id="p" type="password">
 <button class="btn w" onclick="signup()">Create account</button><p class="mut" style="margin-top:12px">Have an account? <a href="#" onclick="S.auth='login';render();return false" style="color:var(--red)">Log in</a></p></main>`;
 if(S.auth==='forgot')return `<main><div class="hero"><h1 class="hd">Reset password</h1></div><label>Account email</label><input id="e" type="email"><button class="btn w" onclick="forgot()">Reset password</button><p class="mut" style="margin-top:12px"><a href="#" onclick="S.auth='login';render();return false" style="color:var(--red)">Back to login</a></p></main>`;
 return `<main><div class="hero"><div class="logo">DANGER X BD 🔥</div><h1 class="hd" style="margin-top:8px">Free Fire tournaments. Free entry.</h1></div>
 <label>Email</label><input id="e" type="email"><label>Password</label><input id="p" type="password">
 <button class="btn w" onclick="login()">Log in</button>
 <div class="row" style="margin-top:12px"><a href="#" onclick="S.auth='signup';render();return false" style="color:var(--red)">Create account</a><a href="#" onclick="S.auth='forgot';render();return false" class="mut">Forgot password?</a></div>
 <p class="mut" style="margin-top:18px">Google login needs Firebase set up in your own project (see setup guide). </p></main>`}
function signup(){const n=$('#n').value.trim(),e=$('#e').value.trim().toLowerCase(),u=$('#u').value.trim(),i=$('#i').value.trim(),p=$('#p').value;
 if(!n||!i)return toast('Enter your player name and in-game name.');
 if(!/^\S+@\S+\.\S+$/.test(e))return toast('Enter a valid email address.');
 if(!/^\d{8,12}$/.test(u))return toast('UID must be 8 to 12 digits.');
 if(p.length<6)return toast('Password needs at least 6 characters.');
 if(db.users.some(x=>x.email===e))return toast('That email is already registered.');
 if(db.users.some(x=>x.uid===u))return toast('That UID is already linked to another account.');
 const id='u'+Date.now();db.users.push({id,name:n,email:e,pw:hash(p),uid:u,ign:i,role:'player',banned:false,created:Date.now()});db.session=id;save();notify('Welcome to DANGER X BD 🔥','Browse tournaments and join for free.',id);S.view='home';S.tab='home';render()}
function login(){const e=$('#e').value.trim().toLowerCase(),p=$('#p').value;const u=db.users.find(x=>x.email===e&&x.pw===hash(p));
 if(!u)return toast('Wrong email or password.');if(u.banned)return toast('This account is suspended. Contact admin.');
 db.session=u.id;save();if(u.role==='admin'){S.view='admin';S.tab='profile'}else{S.view='home';S.tab='home'}render()}
function forgot(){const e=$('#e').value.trim().toLowerCase();const u=db.users.find(x=>x.email===e);
 if(!u)return toast('No account with that email.');u.pw=hash('Reset@123');save();toast('Demo reset: password is now Reset@123');S.auth='login';render()}
function logout(){db.session=null;save();S.auth='login';render()}

function home(){const t=db.tours,f=t.find(x=>x.featured)||t[0],u=me();
 const mine=db.notifs.filter(n=>n.to==='all'||n.to===db.session).slice(0,2);
 const q=S.q.toLowerCase();const hits=q?t.filter(x=>x.title.toLowerCase().includes(q)):[];
 return `<main><h2>Welcome, ${esc(u.ign||u.name)}</h2>
 <input placeholder="Search tournaments" value="${esc(S.q)}" oninput="S.q=this.value;render();document.querySelector('input').focus()">
 ${q?(hits.map(tourCard).join('')||empty('🔍','No tournament matches “'+esc(S.q)+'”.')):`
 ${f?`<div class="hero" onclick="go('tour','${f.id}')" style="cursor:pointer"><span class="tag">FEATURED</span><h1 class="hd">${esc(f.title)}</h1><div class="mut">${f.type} · ${esc(f.map)} · starts in ${cd(f.start)}</div><button class="btn" style="margin-top:12px">View tournament</button></div>`:''}
 <div class="chips">${['Solo','Duo','Squad','Free Entry','Daily','Weekly','Special'].map(c=>`<button class="chip" onclick="S.filter='${c}';go('matches',null,'matches')">${c}</button>`).join('')}</div>
 ${mine.length?`<h3>Announcements</h3>`+mine.map(n=>`<div class="card"><b>${esc(n.title)}</b><div class="mut">${esc(n.body)}</div></div>`).join(''):''}
 ${['live','upcoming','completed'].map(s=>{const l=t.filter(x=>x.status===s);return `<h3 style="margin:10px 0 8px">${s[0].toUpperCase()+s.slice(1)}</h3>`+(l.map(tourCard).join('')||empty('🎮','No '+s+' matches yet.'))}).join('')}`}</main>`}

function matches(){const f=S.filter,all=['All','Solo','Duo','Squad','Free Entry','Daily','Weekly','Special'];
 const l=db.tours.filter(t=>f==='All'||t.type===f||t.cat===f);
 return `<main><h2>Tournaments</h2><div class="chips">${all.map(c=>`<button class="chip ${c===f?'on':''}" onclick="S.filter='${c}';render()">${c}</button>`).join('')}</div>
 ${l.map(tourCard).join('')||empty('🏆','No tournaments in this category.')}
 <h3 style="margin:14px 0 8px">My registrations</h3>${myRegs()}</main>`}
function myRegs(){const l=db.regs.filter(r=>r.uid===db.session);return l.length?l.map(r=>{const t=db.tours.find(x=>x.id===r.tid);return t?`<div class="card row"><div><b>${esc(t.title)}</b><div class="mut">${esc(r.team||r.ign)} · ${r.status}</div></div>${r.status!=='cancelled'?`<button class="btn s g" onclick="go('tour','${t.id}')">Open</button>`:''}</div>`:''}).join(''):empty('📝','You haven’t joined any tournament yet.')}

function tour(){const t=db.tours.find(x=>x.id===S.arg);if(!t)return `<main>${empty('⚠️','Tournament not found.')}</main>`;
 const r=myReg(t.id),full=regsOf(t.id).length>=t.cap,closed=Date.now()>t.deadline||t.status!=='upcoming';
 let act;if(r)act=`<button class="btn g w" onclick="cancelReg('${t.id}')">Cancel registration</button>`;
 else if(full)act=`<button class="btn w" disabled style="opacity:.5">Tournament full</button>`;
 else if(closed)act=`<button class="btn w" disabled style="opacity:.5">Registration closed</button>`;
 else act=`<button class="btn w" onclick="go('reg','${t.id}')">Join tournament</button>`;
 const room=r&&t.room?`<h3 style="margin:12px 0 6px">Room details</h3><div class="room">ID: ${esc(t.room.id)}<br>Password: ${esc(t.room.pw)}</div>`:(r?`<p class="mut" style="margin-top:12px">Room ID and password appear here when the admin publishes them.</p>`:`<p class="mut" style="margin-top:12px">Room details are visible to registered players only.</p>`);
 const res=t.results?`<h3 style="margin:14px 0 6px">Results</h3>${resTable(t.results)}<p style="margin-top:8px">🏆 Winner: <b>${esc(t.results[0].name)}</b></p>`:'';
 return `<main><a href="#" onclick="go('${S.tab==='matches'?'matches':'home'}');return false" class="mut">← Back</a>
 <div class="hero" style="margin-top:8px"><span class="tag ${t.status}">${t.status.toUpperCase()}</span><h1 class="hd">${esc(t.title)}</h1><div class="mut">${t.type} · ${t.cat} · ${esc(t.mode)}</div></div>
 <div class="card"><p>${esc(t.desc)}</p><table><tr><td class="mut">Map</td><td>${esc(t.map)}</td></tr><tr><td class="mut">Starts</td><td>${fmt(t.start)} (${cd(t.start)})</td></tr><tr><td class="mut">Registration closes</td><td>${fmt(t.deadline)}</td></tr><tr><td class="mut">Players</td><td>${regsOf(t.id).length}/${t.cap}</td></tr></table></div>
 <div class="card"><b>Rules</b><div class="mut">${esc(t.rules)}</div></div>${act}${room}${res}</main>`}
function resTable(r){return `<div class="scroll"><table><tr><th>#</th><th>Player/Team</th><th>Kills</th><th>Place pts</th><th>Total</th></tr>${r.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.name)}</td><td>${x.kills}</td><td>${x.pp}</td><td><b>${x.total}</b></td></tr>`).join('')}</table></div>`}

function reg(){const t=db.tours.find(x=>x.id===S.arg),u=me(),n=t.type==='Duo'?1:t.type==='Squad'?3:0;
 return `<main><a href="#" onclick="go('tour','${t.id}');return false" class="mut">← Back</a><h2>Join ${esc(t.title)}</h2>
 <label>Player name</label><input id="n" value="${esc(u.name)}"><label>Free Fire UID</label><input id="u" inputmode="numeric" value="${esc(u.uid)}"><label>In-game name</label><input id="i" value="${esc(u.ign)}">
 ${n?`<label>Team name</label><input id="tm">`+Array.from({length:n},(_,k)=>`<label>Teammate ${k+1}: in-game name</label><input class="mi"><label>Teammate ${k+1}: UID</label><input class="mu" inputmode="numeric">`).join(''):''}
 <button class="btn w" onclick="doReg('${t.id}',${n})">Confirm registration</button></main>`}
function doReg(tid,n){const t=db.tours.find(x=>x.id===tid);
 if(myReg(tid))return toast('You are already registered.');
 if(regsOf(tid).length>=t.cap)return toast('This tournament is full.');
 const name=$('#n').value.trim(),uid=$('#u').value.trim(),ign=$('#i').value.trim();
 if(!name||!ign)return toast('Fill in all fields.');if(!/^\d{8,12}$/.test(uid))return toast('UID must be 8 to 12 digits.');
 let mates=[],team='';
 if(n){team=$('#tm').value.trim();if(!team)return toast('Enter a team name.');
  const mi=[...document.querySelectorAll('.mi')],mu=[...document.querySelectorAll('.mu')];
  for(let k=0;k<n;k++){if(!mi[k].value.trim()||!/^\d{8,12}$/.test(mu[k].value.trim()))return toast('Teammate '+(k+1)+' needs a name and a valid UID.');mates.push({ign:mi[k].value.trim(),uid:mu[k].value.trim()})}}
 const all=[uid,...mates.map(m=>m.uid)];if(new Set(all).size<all.length)return toast('Each player needs a different UID.');
 const taken=regsOf(tid).some(r=>[r.puid,...(r.mates||[]).map(m=>m.uid)].some(x=>all.includes(x)));
 if(taken)return toast('One of these UIDs is already registered here.');
 db.regs.push({id:'r'+Date.now(),tid,uid:db.session,name,puid:uid,ign,team,mates,status:'confirmed',at:Date.now()});save();
 notify('Registration confirmed','You’re in: '+t.title,db.session);toast('Registered! Good luck.');go('tour',tid)}
function cancelReg(tid){if(!confirm('Cancel your registration?'))return;const r=myReg(tid);r.status='cancelled';save();toast('Registration cancelled.');render()}

function ranks(){const m={};db.tours.forEach(t=>(t.results||[]).forEach(x=>{m[x.name]=(m[x.name]||0)+x.total}));
 const l=Object.entries(m).sort((a,b)=>b[1]-a[1]);
 return `<main><h2>Leaderboard</h2>${l.length?`<div class="card scroll"><table><tr><th>#</th><th>Name</th><th>Points</th></tr>${l.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x[0])}</td><td><b>${x[1]}</b></td></tr>`).join('')}</table></div>`:empty('📊','No results yet. Points appear after the first match is scored.')}
 <h3 style="margin:12px 0 8px">Result history</h3>${db.tours.filter(t=>t.results).map(t=>`<div class="card"><b>${esc(t.title)}</b>${resTable(t.results)}</div>`).join('')||empty('🕑','No completed results.')}</main>`}

function alerts(){const l=db.notifs.filter(n=>n.to==='all'||n.to===db.session);
 return `<main><h2>Notifications</h2>${l.map(n=>`<div class="card"><b>${esc(n.title)}</b><div class="mut">${esc(n.body)}</div><div class="mut">${fmt(n.at)}</div></div>`).join('')||empty('🔔','You’re all caught up.')}</main>`}

function profile(){const u=me(),rs=db.regs.filter(r=>r.uid===u.id),wins=db.tours.filter(t=>t.results&&rs.some(r=>r.tid===t.id)&&t.results[0].name===(rs.find(r=>r.tid===t.id).team||rs.find(r=>r.tid===t.id).ign)).length;
 return `<main><div class="hero row"><div>${isAdmin()?`<span class="tag live" style="animation:none">এডমিন</span>`:''}<h1 class="hd">${esc(u.ign)}</h1><div class="mut">${esc(u.name)} · UID ${esc(u.uid||'—')}</div></div><div style="font-size:44px">${esc((u.ign||'?')[0].toUpperCase())}</div></div>
 <div class="row"><div class="card" style="flex:1;text-align:center"><h2>${rs.length}</h2><span class="mut">Joined</span></div><div class="card" style="flex:1;text-align:center"><h2>${wins}</h2><span class="mut">Wins</span></div></div>
 <div class="card"><b>Achievements</b><div class="mut">${rs.length?'🎖 First tournament joined':'Join a tournament to earn your first badge.'} ${wins?'· 🏆 Champion':''}</div></div>
 <button class="btn g w" style="margin-bottom:8px" onclick="go('edit')">Edit profile</button>
 <button class="btn g w" style="margin-bottom:8px" onclick="go('pw')">Change password</button>
 <button class="btn g w" style="margin-bottom:8px" onclick="go('support')">Help & support</button>
 <button class="btn g w" style="margin-bottom:8px" onclick="go('settings')">Settings</button>
 ${isAdmin()?`<button class="btn w" style="margin-bottom:8px" onclick="go('admin')">Open admin panel</button>`:''}
 <button class="btn w" onclick="logout()">Log out</button><h3 style="margin:16px 0 8px">Match history</h3>${myRegs()}</main>`}
function edit(){const u=me();return `<main><a href="#" onclick="go('profile',null,'profile');return false" class="mut">← Back</a><h2>Edit profile</h2><label>Player name</label><input id="n" value="${esc(u.name)}"><label>In-game name</label><input id="i" value="${esc(u.ign)}"><label>Free Fire UID</label><input id="u" value="${esc(u.uid)}"><button class="btn w" onclick="saveEdit()">Save changes</button></main>`}
function saveEdit(){const u=me(),uid=$('#u').value.trim();if(!/^\d{8,12}$/.test(uid))return toast('UID must be 8 to 12 digits.');
 if(db.users.some(x=>x.id!==u.id&&x.uid===uid))return toast('UID already used by another account.');
 u.name=$('#n').value.trim()||u.name;u.ign=$('#i').value.trim()||u.ign;u.uid=uid;save();toast('Profile saved.');go('profile',null,'profile')}
function pw(){return `<main><a href="#" onclick="go('profile',null,'profile');return false" class="mut">← Back</a><h2>Change password</h2><label>Current password</label><input id="o" type="password"><label>New password</label><input id="p" type="password"><button class="btn w" onclick="savePw()">Update password</button></main>`}
function savePw(){const u=me();if(u.pw!==hash($('#o').value))return toast('Current password is wrong.');if($('#p').value.length<6)return toast('New password needs 6+ characters.');u.pw=hash($('#p').value);save();toast('Password updated.');go('profile',null,'profile')}

function settings(){return `<main><a href="#" onclick="go('profile',null,'profile');return false" class="mut">← Back</a><h2>Settings</h2>
 <div class="card"><label><input type="checkbox" style="width:auto" ${db.set.push?'checked':''} onchange="db.set.push=this.checked;save()"> Tournament notifications</label><br><label><input type="checkbox" style="width:auto" ${db.set.priv?'checked':''} onchange="db.set.priv=this.checked;save()"> Hide my UID from other players</label></div>
 <label>Language</label><select onchange="db.lang=this.value;save();toast('Language saved.')">${['English','বাংলা'].map(l=>`<option ${db.lang===l?'selected':''}>${l}</option>`).join('')}</select>
 <div class="card"><b>About</b><div class="mut">DANGER X BD 🔥 v1.0. Free community Free Fire tournaments. No payments, no betting. Not affiliated with Garena.</div></div>
 <div class="card"><b>Privacy policy</b><div class="mut">We store your name, email, UID and registrations only to run tournaments. We never sell data.</div></div>
 <div class="card"><b>Terms and conditions</b><div class="mut">Play fair. Cheating or fake registrations lead to a ban. Admin decisions are final.</div></div></main>`}

function support(){return `<main><a href="#" onclick="go('profile',null,'profile');return false" class="mut">← Back</a><h2>Help center</h2>
 ${[['How do I join?','Open a tournament, tap Join, and confirm your UID.'],['When do I get the room ID?','The admin publishes it shortly before the match. It shows on the tournament page for registered players only.'],['Is it really free?','Yes. No entry fee, no payments, no betting.'],['Tournament rules','No emulators or hacks. One account per player. No teaming. Admin decisions are final.']].map(f=>`<div class="card"><b>${f[0]}</b><div class="mut">${f[1]}</div></div>`).join('')}
 <h3>Report or contact admin</h3><select id="rt"><option>Report problem</option><option>Report player</option><option>Contact admin</option></select><textarea id="rm" rows="4" placeholder="Describe what happened"></textarea><button class="btn w" onclick="sendReport()">Send</button></main>`}
function sendReport(){const m=$('#rm').value.trim();if(m.length<5)return toast('Describe the issue first.');db.reports.unshift({id:'p'+Date.now(),type:$('#rt').value,msg:m,by:me().email,at:Date.now(),open:true});save();toast('Sent. Admin will review it.');go('profile',null,'profile')}

/* ---------- admin ---------- */
function admin(){if(!isAdmin())return `<main>${empty('🔒','Admins only.')}</main>`;
 const tabs=[['tours','Tournaments'],['regs','Players'],['res','Results'],['ann','Announce'],['users','Users'],['rep','Reports'],['log','Activity']];
 let b='';const A=S.atab;
 if(A==='tours')b=`<button class="btn w" onclick="go('tform')">+ Create tournament</button><div style="height:10px"></div>`+db.tours.map(t=>`<div class="card"><div class="row"><b>${esc(t.title)}</b><span class="tag ${t.status}">${t.status}</span></div>
  <div class="row" style="margin:8px 0"><select id="st${t.id}" onchange="setStatus('${t.id}',this.value)">${['upcoming','live','completed','cancelled'].map(s=>`<option ${t.status===s?'selected':''}>${s}</option>`).join('')}</select></div>
  <div class="row"><input id="ri${t.id}" placeholder="Room ID" value="${esc(t.room?.id||'')}" style="flex:1"><input id="rp${t.id}" placeholder="Password" value="${esc(t.room?.pw||'')}" style="flex:1"></div>
  <div class="row"><button class="btn s" onclick="pubRoom('${t.id}')">Publish room</button><button class="btn s g" onclick="go('tform','${t.id}')">Edit</button><button class="btn s g" onclick="delTour('${t.id}')">Delete</button></div></div>`).join('')||empty('🏆','No tournaments yet.');
 if(A==='regs')b=db.tours.map(t=>`<div class="card"><b>${esc(t.title)}</b> <span class="mut">${regsOf(t.id).length}/${t.cap}</span>${regsOf(t.id).map(r=>`<div class="row" style="border-top:1px solid var(--line);padding:6px 0"><span>${esc(r.team||r.ign)}<div class="mut">${esc(r.name)} · ${esc(r.puid)}</div></span><button class="btn s g" onclick="rmReg('${r.id}')">Remove</button></div>`).join('')||'<div class="mut">No players.</div>'}</div>`).join('');
 if(A==='res')b=db.tours.map(t=>`<div class="card"><b>${esc(t.title)}</b><div class="mut">${regsOf(t.id).length} entries</div><button class="btn s" onclick="go('rform','${t.id}')" ${regsOf(t.id).length?'':'disabled style="opacity:.5"'}>Enter results</button>${t.results?` <button class="btn s g" onclick="clearRes('${t.id}')">Clear</button>`:''}</div>`).join('');
 if(A==='ann')b=`<label>Title</label><input id="at"><label>Message</label><textarea id="am" rows="3"></textarea><button class="btn w" onclick="announce()">Send to all players</button>`;
 if(A==='users')b=db.users.map(u=>`<div class="card row"><div><b>${esc(u.ign||u.name)}</b><div class="mut">${esc(u.email)} · ${u.role}${u.banned?' · banned':''}</div></div>${u.role!=='admin'?`<button class="btn s g" onclick="ban('${u.id}')">${u.banned?'Unban':'Ban'}</button>`:''}</div>`).join('');
 if(A==='rep')b=db.reports.map(r=>`<div class="card"><b>${esc(r.type)}</b> <span class="mut">${esc(r.by)}</span><div>${esc(r.msg)}</div>${r.open?`<button class="btn s" onclick="closeRep('${r.id}')">Mark resolved</button>`:'<span class="tag done">resolved</span>'}</div>`).join('')||empty('✅','No reports.');
 if(A==='log')b=db.log.map(l=>`<div class="card"><b>${esc(l.a)}</b><div class="mut">${esc(l.by)} · ${fmt(l.at)}</div></div>`).join('')||empty('📜','No activity yet.');
 return `<main><a href="#" onclick="go('profile',null,'profile');return false" class="mut">← Back</a><h2>Admin dashboard</h2>
 <div class="row"><div class="card" style="flex:1;text-align:center"><h2>${db.users.length}</h2><span class="mut">Users</span></div><div class="card" style="flex:1;text-align:center"><h2>${db.tours.length}</h2><span class="mut">Tournaments</span></div><div class="card" style="flex:1;text-align:center"><h2>${db.regs.filter(r=>r.status!=='cancelled').length}</h2><span class="mut">Entries</span></div></div>
 <div class="chips">${tabs.map(t=>`<button class="chip ${A===t[0]?'on':''}" onclick="S.atab='${t[0]}';render()">${t[1]}</button>`).join('')}</div>${b}</main>`}
function setStatus(id,s){const t=db.tours.find(x=>x.id===id);t.status=s;save();logA('Status of '+t.title+' → '+s);if(s==='cancelled')notify('Tournament cancelled',t.title+' was cancelled.');if(s==='live')notify('Match is live',t.title+' has started.');toast('Status updated.');render()}
function pubRoom(id){const t=db.tours.find(x=>x.id===id),i=$('#ri'+id).value.trim(),p=$('#rp'+id).value.trim();if(!i||!p)return toast('Enter both Room ID and password.');t.room={id:i,pw:p};save();logA('Published room for '+t.title);regsOf(id).forEach(r=>notify('Room details published',t.title+': open the tournament to see them.',r.uid));toast('Room published to registered players.');render()}
function delTour(id){if(!confirm('Delete this tournament and its registrations?'))return;db.tours=db.tours.filter(t=>t.id!==id);db.regs=db.regs.filter(r=>r.tid!==id);save();logA('Deleted tournament '+id);render()}
function rmReg(id){if(!confirm('Remove this registration?'))return;const r=db.regs.find(x=>x.id===id);r.status='cancelled';save();logA('Removed registration '+r.ign);render()}
function ban(id){const u=db.users.find(x=>x.id===id);u.banned=!u.banned;save();logA((u.banned?'Banned ':'Unbanned ')+u.email);render()}
function closeRep(id){db.reports.find(r=>r.id===id).open=false;save();render()}
function announce(){const t=$('#at').value.trim(),m=$('#am').value.trim();if(!t||!m)return toast('Add a title and message.');notify(t,m);logA('Announcement: '+t);toast('Announcement sent.');$('#at').value='';$('#am').value=''}
function clearRes(id){db.tours.find(t=>t.id===id).results=null;save();render()}
function tform(){const t=db.tours.find(x=>x.id===S.arg)||{title:'',type:'Solo',cat:'Daily',map:'Bermuda',mode:'Battle Royale',cap:48,desc:'',rules:'No emulators. No hacks. Admin decisions are final.',start:Date.now()+864e5,deadline:Date.now()+72e6};
 const iso=x=>{const d=new Date(x-new Date().getTimezoneOffset()*6e4);return d.toISOString().slice(0,16)};
 const sel=(id,o,v)=>`<select id="${id}">${o.map(x=>`<option ${x===v?'selected':''}>${x}</option>`).join('')}</select>`;
 return `<main><a href="#" onclick="go('admin');return false" class="mut">← Back</a><h2>${S.arg?'Edit':'Create'} tournament</h2>
 <label>Title</label><input id="ti" value="${esc(t.title)}"><label>Type</label>${sel('ty',['Solo','Duo','Squad'],t.type)}<label>Category</label>${sel('ca',['Daily','Weekly','Free Entry','Special'],t.cat)}
 <label>Map</label>${sel('mp',['Bermuda','Purgatory','Kalahari','Alpine','NeXTerra'],t.map)}<label>Game mode</label><input id="mo" value="${esc(t.mode)}">
 <label>Starts</label><input id="sd" type="datetime-local" value="${iso(t.start)}"><label>Registration deadline</label><input id="dd" type="datetime-local" value="${iso(t.deadline)}">
 <label>Player capacity</label><input id="cp" type="number" min="2" value="${t.cap}"><label>Description</label><textarea id="de" rows="2">${esc(t.desc)}</textarea><label>Rules</label><textarea id="ru" rows="3">${esc(t.rules)}</textarea>
 <label>Banner image (optional)</label><input type="file" accept="image/*" id="bn"><button class="btn w" onclick="saveTour()">Save tournament</button></main>`}
function saveTour(){const g=i=>$('#'+i).value.trim();if(!g('ti'))return toast('Enter a title.');const s=new Date(g('sd')).getTime(),d=new Date(g('dd')).getTime(),c=+g('cp');
 if(!s||!d)return toast('Set both dates.');if(d>s)return toast('Deadline must be before the start time.');if(!(c>=2))return toast('Capacity must be 2 or more.');
 let t=db.tours.find(x=>x.id===S.arg);const isNew=!t;if(isNew){t={id:'t'+Date.now(),status:'upcoming',room:null,results:null};db.tours.unshift(t)}
 Object.assign(t,{title:g('ti'),type:g('ty'),cat:g('ca'),map:g('mp'),mode:g('mo'),start:s,deadline:d,cap:c,desc:g('de'),rules:g('ru')});save();
 logA((isNew?'Created ':'Edited ')+t.title);if(isNew)notify('New tournament',t.title+' is open for registration.');toast('Tournament saved.');go('admin')}
const PP=[12,9,8,7,6,5,4,3,2,1];
function rform(){const t=db.tours.find(x=>x.id===S.arg);const l=regsOf(t.id);
 return `<main><a href="#" onclick="go('admin');return false" class="mut">← Back</a><h2>Results: ${esc(t.title)}</h2><p class="mut">Enter each entry’s placement and kills. Points = placement points (1st = 12, then 9, 8, 7…) + 1 per kill.</p>
 ${l.map(r=>`<div class="card"><b>${esc(r.team||r.ign)}</b><div class="row"><div style="flex:1"><label>Placement</label><input class="pl" type="number" min="1" data-n="${esc(r.team||r.ign)}"></div><div style="flex:1"><label>Kills</label><input class="ki" type="number" min="0" value="0"></div></div></div>`).join('')}
 <button class="btn w" onclick="saveRes('${t.id}')">Publish results</button></main>`}
function saveRes(id){const t=db.tours.find(x=>x.id===id),pl=[...document.querySelectorAll('.pl')],ki=[...document.querySelectorAll('.ki')];
 if(pl.some(p=>!(+p.value>=1)))return toast('Enter a placement for every entry.');
 const r=pl.map((p,i)=>{const pp=PP[+p.value-1]||0,k=+ki[i].value||0;return{name:p.dataset.n,place:+p.value,kills:k,pp,total:pp+k}}).sort((a,b)=>b.total-a.total||a.place-b.place);
 t.results=r;t.status='completed';save();logA('Published results for '+t.title);notify('Results published',t.title+' winner: '+r[0].name);toast('Results published.');go('admin')}

/* ---------- shell ---------- */
function render(){const a=$('#app'),u=me();
 if(!u){a.innerHTML=`<div class="top"><span class="logo">DANGER X BD 🔥</span></div>`+authView();return}
 if(u.banned){logout();return}
 const V={home,matches,ranks,alerts,profile,tour,reg,edit,pw,settings,support,admin,tform,rform};
 const unread=db.notifs.filter(n=>n.to==='all'||n.to===u.id).length;
 let body;try{body=V[S.view]()}catch(e){console.error(e);body=`<main>${empty('⚠️','Something went wrong. Go back and try again.')}</main>`}
 a.innerHTML=`<div class="top"><span class="logo">DANGER X BD 🔥</span><button class="chip" onclick="go('alerts',null,'alerts')">🔔 ${unread}</button></div>${body}
 <nav class="nav">${[['home','🏠','Home'],['matches','🎮','Matches'],['ranks','🏆','Ranks'],['alerts','🔔','Alerts'],['profile','👤','Profile']].map(n=>`<button class="${S.tab===n[0]?'on':''}" onclick="go('${n[0]}',null,'${n[0]}')"><i>${n[1]}</i>${n[2]}</button>`).join('')}</nav>`}
document.getElementById('app').innerHTML=`<div class="splash"><div class="logo">DANGER X BD 🔥</div><div class="bar"><b></b></div><div class="mut">Loading arena…</div></div>`;
setTimeout(render,1700);
</script></body></html>
